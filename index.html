/* ==========================================================================
   Utilities
   ========================================================================== */

/* mulberry32 (§11). The constants below are the published algorithm, not model
   coefficients, and are deliberately not in PARAMS. */
function mulberry32(a){
  return function(){
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const clamp = (v, lo, hi) => v < lo ? lo : v > hi ? hi : v;
const mean  = arr => arr.reduce((a, b) => a + b, 0) / arr.length;

    recordExposure: 0,

    history: [],
  }));
  return {
    seed, rng: mulberry32(seed), q: 0,
    P: I.P, Phi: I.Phi, PhiVar: PARAMS.potency.varianceCoef * I.Phi,
    margin: I.margin, Kill: I.Kill, Kleg: I.Kleg, M: 1,
    norm: I.norm, U: I.U, U0: I.U, D: I.D, D0: I.D,
    Dtreat: I.Dtreat, Duntreated0: I.D - I.Dtreat,
    W: 0, R: PARAMS.treatment.retentionBase,
    deaths: 0, deathsPrev: 0, deathsCum: 0,
    crime: PARAMS.crime.base, incarcerated: 0, records: 0,
    blocs: Object.assign({}, I.blocs), A: 50,
    S: I.S, trust: I.trust, budget: I.budget,
    levers: { E: 0, T: 0, H: 0, G: 0, F: 0 },
    prevLevers: { E: 0, T: 0, H: 0, G: 0, F: 0 },
    Tqueue: new Array(PARAMS.treatment.queueQuarters).fill(0),
    consistencyQuarters: 0,
    lastGChangeQuarter: -PARAMS.levers.reversalWindow,
    lastGDirection: 0,
    pendingBlocPenalty: 0,
    pendingTrustPenalty: 0,
    people,
    forecasts: [],
    history: [],
  };
}

/* Apply a new lever setting, with the §5 coherence and reversal penalties. */
function setLevers(st, next){
  const L = PARAMS.levers;
  const cur = st.levers;
  const changed = ["E","T","H","G","F"].some(k => next[k] !== cur[k]);
  const dG = next.G - cur.G;

  if (Math.abs(dG) > 1){
    st.pendingTrustPenalty += L.coherenceTrustPenalty;
    st.pendingBlocPenalty  += L.coherenceBlocPenalty;
  }
  if (dG !== 0){
    const reversal = st.lastGDirection !== 0
      && Math.sign(dG) === -st.lastGDirection
      && (st.q - st.lastGChangeQuarter) < L.reversalWindow;
    if (reversal){
      st.pendingTrustPenalty += L.reversalTrustPenalty;
      st.pendingBlocPenalty  += L.reversalBlocPenalty;
    }
    if (dG > 0) st.setupCharges = (st.setupCharges || 0) + dG * L.setupG;
    st.lastGChangeQuarter = st.q;
    st.lastGDirection = Math.sign(dG);
  }
  st.consistencyQuarters = changed ? 0 : st.consistencyQuarters;
  st.reversalThisQuarter = st.pendingTrustPenalty > 0;
  st.levers = Object.assign({}, next);
}

/* ==========================================================================
   One quarter, in the fixed evaluation order of §7
   ========================================================================== */

function stepQuarter(st){
  const p = PARAMS;
  const L = st.levers, Lp = st.prevLevers;
  const E = L.E, T = L.T, H = L.H, F = L.F;
  const g = L.G / p.levers.supplyTiers[p.levers.supplyTiers.length - 1];
  const gPrev = Lp.G / p.levers.supplyTiers[p.levers.supplyTiers.length - 1];
  const dE = E - Lp.E, dH = H - Lp.H, dT = T - Lp.T, dG = g - gPrev;
  const before = { W: st.W, incarcerated: st.incarcerated, records: st.records };
  st.q += 1;

  /* -- 1. price and margin (7.1) -------------------------------------- */
  const pr = p.price;
  const Pstar = pr.base * (1 + pr.enforcementLift * E) * (1 - pr.regulationCut * g)
    * Math.pow(pr.K0 / Math.max(st.Kill + st.Kleg, pr.capacityFloor), pr.scarcityExponent);
  st.P += pr.adjust * (Pstar - st.P);
  const riskCost = pr.riskCostCoef * E * (1 - g);
  st.margin = (st.P / pr.base) * (1 - riskCost);

  /* -- 2. capacity, then M (7.2) --------------------------------------- */
  const cp = p.capacity;
  const KillStar = pr.K0 * Math.pow(st.margin / pr.margin0, cp.entryExponent);
  st.Kill += cp.entryAdjust * (KillStar - st.Kill);
  const interdiction = cp.interdictionCoef * Math.max(0, dE) * st.Kill;
  st.Kill = Math.max(st.Kill - interdiction, cp.killFloor);
  const tierMax = p.levers.supplyTiers[p.levers.supplyTiers.length - 1];
  const gLegal = Math.max(0, (L.G - cp.legalSupplyTier) / (tierMax - cp.legalSupplyTier));
  const KlegStar = cp.legTarget * Math.pow(gLegal, cp.legExponent);
  st.Kleg += cp.legAdjust * (KlegStar - st.Kleg);
  st.M = st.Kill / Math.max(st.Kill + st.Kleg, cp.shareFloor);

  /* -- 3. potency and variance (7.3) ------------------------------------ */
  const po = p.potency;
  const PhiStar = 1 + po.enforcementLift * E * (1 - g) - po.regulationCut * g;
  st.Phi += (PhiStar > st.Phi ? po.adjustUp : po.adjustDown) * (PhiStar - st.Phi);
  st.PhiVar = po.varianceCoef * st.Phi * (1 - po.varianceRegCut * g)
            * (1 - po.varianceHarmCut * H);

  /* -- 4. norms (7.4a) --------------------------------------------------- */
  const nm = p.norms;
  const normStar = 1
    + nm.regulationLift * g
    + nm.contagion * Math.max(0, st.U / st.U0 - 1)
    + nm.moralisedSuppression * Math.min(F, 0)
    - nm.enforcementDeterrent * E * (1 - g);
  st.norm += nm.adjust * (normStar - st.norm);

  /* -- 5. prevalence (7.4b) ---------------------------------------------- */
  const pv = p.prevalence;
  const initiation = st.U0 * pv.initiationRate
    * Math.pow(st.P / pr.base, pv.epsilonInit)
    * Math.pow(st.norm, pv.normExponent)
    * (1 - pv.arrestDeterrence * E * (1 - g));
  const cessation = st.U * pv.cessationRate;
  st.U += initiation - cessation;

  /* -- 5b. dependence inflow (7.4c), death outflow deferred -------------- */
  const dp = p.dependence;
  const qtyIndex = Math.pow(st.P / pr.base, dp.epsilonQty);
  const inflow = Math.max(0, st.U - st.D) * dp.inflowRate
               * Math.pow(st.norm, dp.inflowNormExponent);
  const outflow = st.Dtreat * st.R * dp.treatedOutflow + st.D * dp.spontaneousOutflow;
  st.D += inflow - outflow;

  /* -- 6. treatment (7.5) ------------------------------------------------ */
  const tr = p.treatment;
  st.Tqueue.push(T);
  const Tlagged = st.Tqueue.shift();
  const capacity = (tr.capacityBase + tr.capacityPerT * Tlagged) * tr.capacityUnit;
  const meanDiscount = mean(p.person.roster.map(a => a.discountRate));
  const meanStigma = mean(p.person.roster.map(a => a.stigmaSensitivity));
  const frameMult = tr.frameMult[String(F)];
  const presentationRate = tr.presentationBase
    * Math.exp(-meanDiscount * st.W / p.sim.weeksPerQuarter)
    * frameMult
    * (1 + tr.regulationEase * g)
    * (tr.trustFloor + tr.trustGain * st.trust)
    * (F < 0 ? 1 - tr.moralisedStigmaBlock * meanStigma : 1);
  const seeking = st.D * presentationRate;
  const Wstar = Math.max(0, tr.waitScale * seeking / Math.max(capacity, 1));
  st.W += tr.waitAdjust * (Wstar - st.W);
  st.R = clamp(tr.retentionBase + tr.retentionPerT * T
    + (F > 0 ? tr.retentionMedicalised : 0)
    - (F < 0 ? tr.retentionMoralised : 0), tr.retentionMin, tr.retentionMax);
  const admissions = Math.min(seeking, Math.max(0, capacity - st.Dtreat));
  const exits = st.Dtreat * (st.R * dp.treatedOutflow + (1 - st.R) * tr.dropoutRate);
  st.Dtreat = Math.max(0, Math.min(st.Dtreat + admissions - exits, capacity));

  /* -- 7. deaths (7.6), from the post-inflow D --------------------------- */
  const de = p.deaths;
  const Duntreated = Math.max(st.D - st.Dtreat, 0);
  st.deathsPrev = st.deaths;
  st.deaths = Duntreated * de.baseRate
    * (st.PhiVar / po.varianceRef)
    * (1 - de.harmReductionCut * H)
    * (1 - de.treatedCoverageCut * st.Dtreat / Math.max(st.D, 1));

  /* -- 8. apply deaths ---------------------------------------------------- */
  st.D = Math.max(0, st.D - st.deaths);
  st.deathsCum += st.deaths;

  /* -- 9. crime, incarceration, records (7.7) ----------------------------- */
  const cr = p.crime;
  st.crime = cr.base * (Duntreated / st.Duntreated0)
    * Math.pow(st.P / pr.base, cr.priceExponent) * qtyIndex
    * (1 - cr.regulationCut * g);
  const releases = st.incarcerated * cr.releaseRate;
  st.incarcerated += cr.incarcerationCoef * E * st.U * (1 - g) - releases;
  st.records += cr.recordsCoef * E * st.U * (1 - g);

  /* -- fiscal ------------------------------------------------------------- */
  const lv = p.levers;
  const spend = lv.costE * E + lv.costT * T + lv.costH * H
    + lv.incarcerationCostPerPerson * st.incarcerated
    - lv.revenueG * g * (st.U / st.U0)
    + (st.setupCharges || 0);
  st.setupCharges = 0;
  st.budget += lv.budgetPerQuarter - spend;

  /* -- 10. constituencies and approval (7.8) ------------------------------ */
  updateBlocs(st, { dE, dH, dT, dG, F, before });

  /* -- 11. trust (7.9) ----------------------------------------------------- */
  const tu = p.trust;
  st.consistencyQuarters = Math.min(st.consistencyQuarters + 1, tu.consistencyWindow);
  const consistencyGain = st.trust >= tu.consistencyCeiling ? 0
    : tu.consistencyGain * (st.consistencyQuarters / tu.consistencyWindow);
  st.trust = clamp(st.trust + consistencyGain
    - st.pendingTrustPenalty
    - tu.enforcementPenalty * E * (1 - g), tu.min, tu.max);
  st.pendingTrustPenalty = 0;

  /* -- 12. the twelve (§9) -------------------------------------------------- */
  updatePeople(st, { E, T, H, F, g, capacity, frameMult });

  st.S *= p.blocs.salienceDecay;
  /* Deltas are quarter-on-quarter: a lever change seizes capacity once (§7.2)
     and moves a bloc once (§7.8), not every quarter it stays raised. */
  st.prevLevers = Object.assign({}, st.levers);
  st.history.push(snapshot(st));
  return st;
}

/* ---- §7.8 ---------------------------------------------------------------- */
function updateBlocs(st, ctx){
  const b = PARAMS.blocs, lv = PARAMS.levers;
  const { dE, dH, dT, dG, F, before } = ctx;
  const dW = st.W - before.W;
  const dIncarcerated = st.incarcerated - before.incarcerated;
  const dRecords = st.records - before.records;
  const eventImpact = 0;            // media events are build-order step 10
  const punitive = 0;               // ditto
  const deficit = Math.max(0, -st.budget / b.deficitScale);
  const overFloor = Math.max(0, (lv.deficitFloor - st.budget) / b.deficitScale);

  let dCentre = -b.centre.crime * (st.crime - PARAMS.crime.base)
    - b.centre.deficit * deficit
    - eventImpact * (1 + st.S) * b.centre.event
    - overFloor * lv.deficitPenaltyRate;   // compounding, past the deficit floor

  let dProg = b.prog.deaths * (st.deathsPrev - st.deaths)
      * (b.prog.salienceFloor + b.prog.salienceGain * st.S)
    - b.prog.incarceration * (dIncarcerated / b.prog.personScale)
    - b.prog.records * (dRecords / b.prog.personScale)
    + b.prog.dG * (dG * PARAMS.levers.supplyTiers[PARAMS.levers.supplyTiers.length - 1])
    - b.prog.dE * dE;

  let dTrad = -b.trad.crime * (st.crime - PARAMS.crime.base)
    - b.trad.dG * (dG * PARAMS.levers.supplyTiers[PARAMS.levers.supplyTiers.length - 1])
    - b.trad.dH * dH
    + (F < 0 ? b.trad.moralised : 0)
    - (F > 0 ? b.trad.medicalised : 0)   // the frame they want, negated
    - b.trad.prevalence * (st.U / st.U0 - 1) * b.prevalenceScale;

  let dHealth = b.health.deaths * (st.deathsPrev - st.deaths)
    - b.health.dW * dW
    + b.health.dT * dT
    + (F > 0 ? b.health.medicalised : 0)
    - b.health.punitive * punitive;

  const pen = st.pendingBlocPenalty;
  st.pendingBlocPenalty = 0;
  const rev = k => b.reversion * (b.baseline - st.blocs[k]);
  st.blocs.centre = clamp(st.blocs.centre + dCentre + rev("centre") - pen, b.min, b.max);
  st.blocs.prog   = clamp(st.blocs.prog   + dProg   + rev("prog")   - pen, b.min, b.max);
  st.blocs.trad   = clamp(st.blocs.trad   + dTrad   + rev("trad")   - pen, b.min, b.max);
  st.blocs.health = clamp(st.blocs.health + dHealth + rev("health") - pen, b.min, b.max);
  st.A = b.weights.centre * st.blocs.centre + b.weights.prog * st.blocs.prog
       + b.weights.trad * st.blocs.trad + b.weights.health * st.blocs.health;
}

/* ---- §9 ------------------------------------------------------------------ */
function updatePeople(st, ctx){
  const pp = PARAMS.person;
  const { E, T, H, F, g, capacity, frameMult } = ctx;
  const prevStability = st.people.map(x => x.stability);

  for (const person of st.people){
    const a = person.attr;
    if (person.state === "deceased"){ person.history.push(0); continue; }

    /* escalation: the psychological channel by which a permissive norm reaches
       the people most sensitive to it (§9.1, Aisha and Callum) */
    person.escalation = clamp(person.escalation
      + pp.escalationRate * a.normSensitivity * (st.norm - 1),
      0, pp.escalationMax);

    /* records: cumulative, irreversible, invisible in the aggregates (§7.7) */
    person.recordExposure += Math.max(0, E * (1 - g) - pp.recordExposureFloor)
                           * a.arrestExposure;
    if (!person.record && person.recordExposure >= pp.recordThreshold) person.record = true;

    /* custody */
    if (person.state === "incarcerated"){
      person.quartersIncarcerated += 1;
      if (person.quartersIncarcerated >= pp.releaseAfterQuarters){
        person.state = "precarious"; person.quartersIncarcerated = 0;
      }
    } else if (st.rng() < pp.arrestHazardBase * E * (1 - g) * a.arrestExposure){
      person.state = "incarcerated"; person.quartersIncarcerated = 0;
    }

    /* presentation to treatment — per-person, discounted against W (§9) */
    if (person.state !== "in-treatment" && person.state !== "incarcerated"
        && a.dependent && st.Dtreat < capacity){   // only dependence presents
      const pPresent = pp.presentationBase
        * Math.exp(-a.discountRate * st.W / PARAMS.sim.weeksPerQuarter)
        * frameMult
        * (1 + PARAMS.treatment.regulationEase * g)
        * (PARAMS.treatment.trustFloor + PARAMS.treatment.trustGain * st.trust)
        * a.serviceReach
        * (1 - a.stigmaSensitivity * (F < 0 ? 1 : 0));
      if (st.rng() < pPresent){ person.state = "in-treatment"; person.quartersInTreatment = 0; }
    }

    /* stability target */
    let target;
    if (a.carerOf !== null && a.carerOf !== undefined){
      const sib = prevStability[a.carerOf];
      target = pp.stabilityMax - pp.carerWeight * (pp.stabilityMax - sib);
    } else if (a.outOfScope > 0){
      target = pp.stabilityBase
        + pp.wTrajectory * a.trajectory
        + pp.wTreatmentFunding * T
        - pp.wCapacityCrowding * (st.W / PARAMS.sim.weeksPerQuarter)
        + pp.wSupport * (a.socialSupport - pp.supportMid)
        + (person.state === "in-treatment" ? pp.wInTreatment * st.R * a.treatmentBenefit : 0);
    } else {
      target = pp.stabilityBase
        + pp.wTrajectory * a.trajectory
        + pp.wSupport * (a.socialSupport - pp.supportMid)
        + (person.state === "in-treatment" ? pp.wInTreatment * st.R * a.treatmentBenefit : 0)
        + pp.wHarmReduction * H * a.riskExposure
        - pp.wVariance * a.varSensitivity * (st.PhiVar >= pp.varRef
            ? (st.PhiVar / pp.varRef - 1)
            : pp.wVarianceRelief * (st.PhiVar / pp.varRef - 1))
        - pp.wPrice * Math.max(0, st.P / PARAMS.price.base - 1) * a.incomeDependence
        - pp.wEscalation * person.escalation
        + pp.wDeterrence * E * (1 - g) * a.deterrenceBenefit
        - pp.wEnforcementHarm * E * (1 - g) * a.enforcementHarm
        - pp.wRecord * (person.record ? 1 : 0) * a.recordSensitivity
        - pp.wStigmaMoralised * a.stigmaSensitivity * (F < 0 ? 1 : 0)
        + pp.wFrameMedicalised * a.stigmaSensitivity * (F > 0 ? 1 : 0)
        + pp.wTrust * (st.trust - pp.trustRef) * (1 - a.serviceTrust)
        + pp.wLegalSupply * a.legalSupplyBenefit * (st.Kleg / Math.max(st.Kill + st.Kleg, PARAMS.capacity.shareFloor))
        + pp.wSupplyIncome * a.supplyIncome * (st.M - pp.marketShareRef)
        - pp.wSupplyCollapse * a.supplyIncome * (st.levers.G >= pp.supplyCollapseTier ? 1 : 0)
        - pp.wWait * (st.W / PARAMS.sim.weeksPerQuarter) * a.discountRate * (a.user ? 1 : 0);
    }
    target = clamp(target, pp.stabilityMin, pp.stabilityMax);
    person.stability = clamp(person.stability + pp.adjust * (target - person.stability),
                             pp.stabilityMin, pp.stabilityMax);

    /* treatment tenure, recovery, relapse */
    if (person.state === "in-treatment"){
      person.quartersInTreatment += 1;
      if (st.rng() < (1 - st.R) * pp.dropoutBase){
        person.state = "precarious";
      } else if (person.stability >= pp.recoveredStability
                 && person.quartersInTreatment >= pp.recoveredMinQuarters){
        person.state = "recovered";
      }
    } else if (person.state === "recovered"){
      if (person.stability < pp.relapseStability) person.state = "precarious";
    } else if (person.state !== "incarcerated"){
      person.state = person.stability >= pp.stableThreshold ? "stable"
                   : person.stability >= pp.crisisThreshold ? "precarious" : "crisis";
    }

    /* mortality — terminal and irreversible */
    const hazard = pp.deathHazardBase
      * (st.PhiVar / pp.varRef)
      * a.riskExposure
      * (1 - PARAMS.deaths.harmReductionCut * H)
      * (person.state === "crisis" ? pp.deathHazardCrisis : 1)
      * (person.state === "in-treatment" ? pp.deathHazardTreated : 1);
    if (st.rng() < hazard){ person.state = "deceased"; person.stability = 0; }

    person.history.push(person.stability);
  }
}

function snapshot(st){
  return {
    q: st.q, P: st.P, Phi: st.Phi, PhiVar: st.PhiVar, margin: st.margin,
    Kill: st.Kill, Kleg: st.Kleg, M: st.M, norm: st.norm,
    U: st.U, D: st.D, Dtreat: st.Dtreat, W: st.W, R: st.R,
    deaths: st.deaths, deathsCum: st.deathsCum, crime: st.crime,
    incarcerated: st.incarcerated, records: st.records,
    blocs: Object.assign({}, st.blocs), A: st.A, trust: st.trust,
    budget: st.budget, S: st.S,
    levers: Object.assign({}, st.levers),
    people: st.people.map(p => ({ name: p.name, stability: p.stability,
                                  state: p.state, record: p.record })),
  };
}

/* ==========================================================================
   Runner
   ========================================================================== */

/* config: { E, T, H, G, F } held constant, or a function (quarter) => config */
function runSim(config, opts){
  opts = opts || {};
  const st = createState(opts.seed === undefined ? PARAMS.sim.defaultSeed : opts.seed);
  const quarters = opts.quarters || PARAMS.sim.quarters;
  const at = typeof config === "function" ? config : () => config;
  for (let q = 1; q <= quarters; q++){
    const want = at(q);
    const next = Object.assign({}, st.levers, want);
    if (["E","T","H","G","F"].some(k => next[k] !== st.levers[k])) setLevers(st, next);
    stepQuarter(st);
  }
  return st;
}

/* Run a twelve-round schedule: one lever setting per cabinet round (§4.1). */
function runRounds(schedule, opts){
  opts = opts || {};
  const st = createState(opts.seed === undefined ? PARAMS.sim.defaultSeed : opts.seed);
  PARAMS.sim.roundQuarters.forEach((n, r) => {
    const want = schedule[Math.min(r, schedule.length - 1)];
    const next = Object.assign({}, st.levers, want);
    if (["E","T","H","G","F"].some(k => next[k] !== st.levers[k])) setLevers(st, next);
    for (let i = 0; i < n; i++) stepQuarter(st);
  });
  return st;
}

/* Did this person have a good ten years? (§14 tests 7 / 7b) */
function personGood(person){
  const o = PARAMS.outcome;
  if (o.badStates.includes(person.state)) return false;
  const window = person.history.slice(-o.goodWindowQuarters);
  if (!window.length) return false;
  return person.stability >= o.goodFinalStability && mean(window) >= o.goodMeanStability;
}

function outcomeReport(st){
  return st.people.map(p => ({
    name: p.name, state: p.state, record: p.record,
    final: p.stability, meanLate: mean(p.history.slice(-PARAMS.outcome.goodWindowQuarters)),
    good: personGood(p),
  }));
}

/* Grid sweep over the lever space (§14 tests 7, 7b, 7c). */
function sweep(opts){
  opts = opts || {};
  const seeds = opts.seeds || [PARAMS.sim.defaultSeed];
  const results = [];
  for (const E of PARAMS.levers.detents)
  for (const T of PARAMS.levers.detents)
  for (const H of PARAMS.levers.detents)
  for (const G of PARAMS.levers.supplyTiers)
  for (const F of PARAMS.levers.frames){
    const cfg = { E, T, H, G, F };
    for (const seed of seeds){
      const st = runSim(cfg, { seed });
      results.push({ cfg, seed, st });
    }
  }
  return results;
}

/* Longest run of consecutive quarters with all four blocs above threshold. */
function longestAllBlocRun(st){
  const t = PARAMS.blocs.satisfiedThreshold;
  let best = 0, run = 0, bestEnd = 0;
  for (const h of st.history){
    const all = h.blocs.centre > t && h.blocs.prog > t && h.blocs.trad > t && h.blocs.health > t;
    run = all ? run + 1 : 0;
    if (run > best){ best = run; bestEnd = h.q; }
  }
  return { best, bestEnd };
}

const WARD = {
  PARAMS, createState, setLevers, stepQuarter, runSim, runRounds, snapshot,
  personGood, outcomeReport, sweep, longestAllBlocRun, mulberry32,
  selfTest(){
    const st = runSim({ E: 0, T: 0, H: 0, G: 0, F: 0 });
    console.table(outcomeReport(st));
    return st;
  },
};
if (typeof window !== "undefined") window.WARD = WARD;
if (typeof module !== "undefined" && module.exports) module.exports = WARD;
